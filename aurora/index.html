<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f0b8cc; }
    canvas {
      display: block;
      position: fixed;
      top: -60px;
      left: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      cursor: none;
      filter: blur(18px);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
  (() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const palette = [
      [255, 154, 158],
      [254, 207, 239],
      [252, 182, 159],
      [255, 110, 127],
      [248, 187, 208],
      [255, 218, 185],
      [255, 166, 158],
      [244, 154, 194],
      [200, 182, 232],
      [174, 210, 240],
    ];

    class Blob {
      constructor(i) {
        this.color = palette[i % palette.length];
        const phi = (1 + Math.sqrt(5)) / 2;
        this.baseX = ((i * phi) % 1);
        this.baseY = ((i * phi * phi) % 1);
        this.freqX1 = 0.13 + i * 0.071;
        this.freqY1 = 0.11 + i * 0.083;
        this.freqX2 = 0.037 + i * 0.029;
        this.freqY2 = 0.043 + i * 0.031;
        this.freqR  = 0.05 + i * 0.019;
        this.phaseX = i * 2.39996;
        this.phaseY = i * 3.14159;
        this.baseRadius = Math.max(canvas.width, canvas.height) * (0.45 + (i % 3) * 0.1);
      }

      update(t) {
        const w = canvas.width, h = canvas.height;
        this.x = w * (this.baseX
          + 0.3 * Math.sin(t * this.freqX1 + this.phaseX)
          + 0.15 * Math.sin(t * this.freqX2 + this.phaseX * 1.7));
        this.y = h * (this.baseY
          + 0.3 * Math.sin(t * this.freqY1 + this.phaseY)
          + 0.15 * Math.sin(t * this.freqY2 + this.phaseY * 1.3));
        this.radius = this.baseRadius * (0.85 + 0.15 * Math.sin(t * this.freqR + this.phaseX));
      }

      draw(ctx) {
        const [r, g, b] = this.color;
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        grad.addColorStop(0,   `rgba(${r},${g},${b},0.5)`);
        grad.addColorStop(0.3, `rgba(${r},${g},${b},0.35)`);
        grad.addColorStop(0.6, `rgba(${r},${g},${b},0.18)`);
        grad.addColorStop(1,   `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    const blobs = Array.from({ length: 7 }, (_, i) => new Blob(i));

    function frame(ts) {
      const t = ts * 0.001;
      ctx.fillStyle = '#f0b8cc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const blob of blobs) {
        blob.update(t);
        blob.draw(ctx);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
