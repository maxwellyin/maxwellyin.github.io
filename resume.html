<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>Resume - Maxwell J. Yin</title>
  <meta
    name="description"
    content="Resume preview and PDF download for Maxwell J. Yin, Machine Learning Engineer."
  />
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #1d4ed8;
      --accent-dark: #1e40af;
      --border: #e5e7eb;
      --soft: #eff6ff;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --max-width: 1040px;
      --content-inset: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(29, 78, 216, 0.10), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
      color: white;
      padding: 42px 0 36px;
    }

    .header-inner {
      max-width: calc(var(--max-width) + 32px);
      margin: 0 auto;
      padding: 0 calc(16px + var(--content-inset));
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
    }

    .brand {
      color: white;
      font-weight: 750;
      letter-spacing: 0.2px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-links a {
      color: #dbeafe;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 7px 13px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-links a:hover,
    .nav-links .active {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.24);
      text-decoration: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 4.7vw, 4.1rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      display: none;
    }

    main {
      max-width: calc(var(--max-width) + 32px);
      margin: 0 auto;
      padding: 30px 16px 54px;
    }

    .resume-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .resume-intro {
      padding: 24px 28px 22px;
      border-bottom: 1px solid var(--border);
    }

    .resume-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .resume-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .primary-link {
      background: var(--accent);
      color: white;
    }

    .primary-link:hover {
      background: var(--accent-dark);
      color: white;
      transform: translateY(-1px);
    }

    .secondary-link {
      border: 1px solid #bfdbfe;
      background: white;
      color: var(--accent);
    }

    .secondary-link:hover {
      background: var(--soft);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .resume-viewer {
      width: 100%;
      height: min(1120px, 78vh);
      border: 0;
      display: block;
      background: #f3f4f6;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 8px 16px 32px;
      font-size: 0.95rem;
    }

    #fun-stuff {
      color: var(--muted);
      font-size: 0.85rem;
      opacity: 0.6;
      text-decoration: none;
      transition: 0.2s;
    }

    #fun-stuff:hover {
      color: var(--accent);
      opacity: 1;
      text-decoration: underline;
    }

    @media (max-width: 780px) {
      .top-nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-inner {
        padding: 0 20px;
      }

      .resume-intro {
        padding-left: 20px;
        padding-right: 20px;
      }

      .resume-viewer {
        height: 72vh;
      }
    }
  </style>
</head>
<body data-page="resume">
  <header>
    <div class="header-inner">
      <nav class="top-nav" aria-label="Primary navigation" data-site-shell="subpage-nav"></nav>
      <h1>Resume preview and download</h1>
    </div>
  </header>

  <main>
    <section class="resume-card">
      <div class="resume-intro">
        <div class="resume-actions">
          <a class="primary-link" href="/assets/Maxwell_Yin_Resume.pdf" target="_blank" rel="noopener">Open PDF</a>
          <a class="secondary-link" href="/assets/Maxwell_Yin_Resume.pdf" download>Download PDF</a>
        </div>
      </div>

      <iframe
        class="resume-viewer"
        src="/assets/Maxwell_Yin_Resume.pdf"
        title="Resume preview for Maxwell J. Yin"
      ></iframe>
    </section>
  </main>

  <footer data-site-shell="footer"></footer>
  <script src="/assets/site-shell.js?v=20260427-1"></script>
</body>
</html>
