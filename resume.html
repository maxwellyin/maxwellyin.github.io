<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="/assets/site-theme.css?v=20260427-3" />
  <title>Resume - Maxwell J. Yin</title>
  <meta
    name="description"
    content="Resume preview and PDF download for Maxwell J. Yin, Machine Learning Engineer."
  />
  <style>
    .subtitle {
      display: none;
    }

    .resume-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .resume-intro {
      padding: 24px 28px 22px;
      border-bottom: 1px solid var(--border);
    }

    .resume-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .resume-actions a {
      min-height: 44px;
      padding: 0 18px;
    }

    .resume-viewer {
      width: 100%;
      height: min(1120px, 78vh);
      border: 0;
      display: block;
      background: #f3f4f6;
    }

    @media (max-width: 780px) {
      .resume-intro {
        padding-left: 20px;
        padding-right: 20px;
      }

      .resume-viewer {
        height: 72vh;
      }
    }
  </style>
</head>
<body data-page="resume">
  <header>
    <div class="header-inner">
      <nav class="top-nav" aria-label="Primary navigation" data-site-shell="subpage-nav"></nav>
      <h1>Resume preview and download</h1>
    </div>
  </header>

  <main>
    <section class="resume-card">
      <div class="resume-intro">
        <div class="resume-actions">
          <a class="primary-link" href="/assets/Maxwell_Yin_Resume.pdf" target="_blank" rel="noopener">Open PDF</a>
          <a class="secondary-link" href="/assets/Maxwell_Yin_Resume.pdf" download>Download PDF</a>
        </div>
      </div>

      <iframe
        class="resume-viewer"
        src="/assets/Maxwell_Yin_Resume.pdf"
        title="Resume preview for Maxwell J. Yin"
      ></iframe>
    </section>
  </main>

  <footer data-site-shell="footer"></footer>
  <script src="/assets/site-shell.js?v=20260427-2"></script>
</body>
</html>
