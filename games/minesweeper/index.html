<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minesweeper</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --accent: #1d4ed8;
      --muted: #6b7280;
      --cell-bg: #f1f5f9;
      --cell-hover: #e2e8f0;
      --cell-revealed: #ffffff;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    .game-card {
      width: min(100%, 460px);
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: -0.04em;
    }
    .home-link {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .home-link:hover {
      background: var(--bg);
      border-color: var(--muted);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    #reset {
      cursor: pointer;
      user-select: none;
      font-size: 1.8rem;
      transition: transform 0.1s;
    }
    #reset:active { transform: scale(0.9); }
    #board {
      display: grid;
      gap: 2px;
      background: var(--border);
      padding: 2px;
      border-radius: 12px;
      overflow: hidden;
    }
    .cell {
      width: 100%;
      aspect-ratio: 1;
      background: var(--cell-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) {
      background: var(--cell-hover);
    }
    .cell.revealed {
      background: var(--cell-revealed);
      cursor: default;
    }
    .cell.mine { background-color: #ef4444; color: white; }
    
    .c1 { color: #3b82f6; }
    .c2 { color: #10b981; }
    .c3 { color: #ef4444; }
    .c4 { color: #8b5cf6; }
    .c5 { color: #f59e0b; }
    .c6 { color: #06b6d4; }
    .c7 { color: var(--text); }
    .c8 { color: var(--muted); }
    
    .hint {
      margin-top: 20px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="game-header">
      <div>
        <p class="eyebrow">Hidden Game</p>
        <h1>Minesweeper</h1>
      </div>
      <a href="/games/" class="home-link">Back</a>
    </div>
    
    <div class="status-bar">
      <div id="mines-count" style="color: #ef4444;">010</div>
      <div id="reset">😊</div>
      <div id="timer" style="opacity: 0.5;">000</div>
    </div>
    
    <div id="board" oncontextmenu="return false;"></div>
    
    <p class="hint">Left click to reveal, Right click to flag.</p>
  </div>

  <script>
    const ROWS = 10;
    const COLS = 10;
    const MINES = 10;
    let board = [];
    let minePositions = [];
    let gameOver = false;
    let flags = 0;
    let revealedCount = 0;
    
    const boardEl = document.getElementById('board');
    const minesCountEl = document.getElementById('mines-count');
    const resetBtn = document.getElementById('reset');
    
    boardEl.style.gridTemplateColumns = `repeat(${COLS}, 25px)`;

    function init() {
      board = [];
      minePositions = [];
      gameOver = false;
      flags = 0;
      revealedCount = 0;
      boardEl.innerHTML = '';
      resetBtn.innerText = '😊';
      updateMinesCount();
      
      for (let r = 0; r < ROWS; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.r = r;
          cell.dataset.c = c;
          
          cell.addEventListener('mousedown', (e) => {
            if (e.button === 0) reveal(r, c);
            if (e.button === 2) toggleFlag(r, c);
          });
          
          boardEl.appendChild(cell);
          row.push({
            el: cell,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            neighborMines: 0
          });
        }
        board.push(row);
      }
      
      let minesPlaced = 0;
      while (minesPlaced < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].isMine) {
          board[r][c].isMine = true;
          minePositions.push({r, c});
          minesPlaced++;
        }
      }
      
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].neighborMines = count;
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameOver || board[r][c].isRevealed) return;
      const cell = board[r][c];
      if (cell.isFlagged) {
        cell.isFlagged = false;
        cell.el.innerText = '';
        flags--;
      } else {
        if (flags < MINES) {
          cell.isFlagged = true;
          cell.el.innerText = '🚩';
          flags++;
        }
      }
      updateMinesCount();
    }

    function reveal(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.isRevealed || cell.isFlagged) return;
      
      cell.isRevealed = true;
      cell.el.classList.add('revealed');
      revealedCount++;
      
      if (cell.isMine) {
        gameOver = true;
        cell.el.classList.add('mine');
        cell.el.innerText = '💣';
        resetBtn.innerText = '😵';
        revealAllMines();
        return;
      }
      
      if (cell.neighborMines > 0) {
        cell.el.innerText = cell.neighborMines;
        cell.el.classList.add(`c${cell.neighborMines}`);
      } else {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(nr, nc);
            }
          }
        }
      }
      
      if (revealedCount === ROWS * COLS - MINES) {
        gameOver = true;
        resetBtn.innerText = '😎';
      }
    }

    function revealAllMines() {
      for (const pos of minePositions) {
        const cell = board[pos.r][pos.c];
        if (!cell.isRevealed) {
          cell.el.classList.add('revealed');
          cell.el.innerText = '💣';
        }
      }
    }

    function updateMinesCount() {
      let left = MINES - flags;
      minesCountEl.innerText = left.toString().padStart(3, '0');
    }

    resetBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
