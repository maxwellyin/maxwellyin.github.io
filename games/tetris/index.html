<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --accent: #1d4ed8;
      --muted: #6b7280;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    .game-card {
      width: min(100%, 400px);
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: -0.04em;
    }
    .home-link {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .home-link:hover {
      background: var(--bg);
      border-color: var(--muted);
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 24px;
    }
    .score-label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .auto-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auto-btn:hover { background: #e5e7eb; }
    .auto-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    canvas {
      width: 100%;
      height: auto;
      background: var(--bg);
      border-radius: 12px;
      display: block;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .hint {
      margin-top: 20px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
    @media (max-width: 640px) {
      body {
        justify-content: flex-start;
        padding: 16px 10px;
      }
      .game-card {
        width: 100%;
        padding: 18px 14px;
        border-radius: 18px;
      }
      .game-header {
        margin-bottom: 18px;
      }
      h1 {
        font-size: 2rem;
      }
      .score-row {
        padding: 10px 12px;
        margin-bottom: 18px;
      }
      .hint {
        margin-top: 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="game-header">
      <div>
        <p class="eyebrow">Hidden Game</p>
        <h1>Tetris</h1>
      </div>
      <a href="/games/" class="home-link">Back</a>
    </div>
    
    <div class="score-row">
      <div>
        <span class="score-label">Score</span>
        <span class="score-val" id="score-val">0</span>
      </div>
      <button id="auto-btn" class="auto-btn">Auto: OFF</button>
    </div>
    
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <p class="hint">Use arrow keys to move and rotate.</p>
  </div>
  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
      if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
      if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
      if (type === 'O') return [[4, 4], [4, 4]];
      if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
      if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
      if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            const color = colors[value];
            const px = x + offset.x;
            const py = y + offset.y;
            
            const m = 0.06; // margin
            const s = 1 - m * 2; // size
            const r = 0.25; // border radius
            
            // Base rounded stone
            context.fillStyle = color;
            context.beginPath();
            context.roundRect(px + m, py + m, s, s, r);
            context.fill();
            
            // Soft top highlight
            context.fillStyle = 'rgba(255, 255, 255, 0.35)';
            context.beginPath();
            context.roundRect(px + m + 0.08, py + m + 0.08, s - 0.16, s * 0.35, r - 0.05);
            context.fill();
            
            // Subtle bottom shadow
            context.fillStyle = 'rgba(0, 0, 0, 0.25)';
            context.beginPath();
            context.roundRect(px + m + 0.08, py + m + s - (s * 0.35) - 0.08, s - 0.16, s * 0.35, r - 0.05);
            context.fill();
          }
        });
      });
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid
      context.lineWidth = 0.05;
      context.strokeStyle = 'rgba(150, 150, 150, 0.2)';
      for (let i = 0; i <= canvas.width; i++) {
        context.beginPath();
        context.moveTo(i, 0);
        context.lineTo(i, canvas.height);
        context.stroke();
      }
      for (let i = 0; i <= canvas.height; i++) {
        context.beginPath();
        context.moveTo(0, i);
        context.lineTo(canvas.width, i);
        context.stroke();
      }

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    let autoMode = false;
    let autoSpeedMultiplier = 1;
    let aiTarget = null;
    let aiRotationsDone = 0;

    function cloneMatrix(mat) {
      return mat.map(row => [...row]);
    }

    function evaluateBoard(board) {
      let aggregateHeight = 0, completeLines = 0, holes = 0, bumpiness = 0;
      let heights = new Array(board[0].length).fill(0);
      for (let y = 0; y < board.length; ++y) {
        let lineComplete = true;
        for (let x = 0; x < board[y].length; ++x) {
          if (board[y][x] !== 0) {
            if (heights[x] === 0) heights[x] = board.length - y;
          } else {
            lineComplete = false;
            if (heights[x] > 0) holes++;
          }
        }
        if (lineComplete) completeLines++;
      }
      for (let x = 0; x < heights.length; x++) {
        aggregateHeight += heights[x];
        if (x > 0) bumpiness += Math.abs(heights[x] - heights[x-1]);
      }
      return -0.510066 * aggregateHeight + 0.760666 * completeLines - 0.35663 * holes - 0.184483 * bumpiness;
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let bestMove = { rot: 0, x: player.pos.x };
      for (let rot = 0; rot < 4; rot++) {
        const testPlayer = { pos: {x: player.pos.x, y: player.pos.y}, matrix: cloneMatrix(player.matrix) };
        for (let i = 0; i < rot; i++) {
          for (let y = 0; y < testPlayer.matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
              [testPlayer.matrix[x][y], testPlayer.matrix[y][x]] = [testPlayer.matrix[y][x], testPlayer.matrix[x][y]];
            }
          }
          testPlayer.matrix.forEach(row => row.reverse());
        }
        const boardWidth = arena[0].length;
        for (let x = -3; x < boardWidth + 3; x++) {
          testPlayer.pos.x = x;
          testPlayer.pos.y = 0;
          if (collide(arena, testPlayer)) continue;
          while (!collide(arena, testPlayer)) testPlayer.pos.y++;
          testPlayer.pos.y--;
          const testBoard = cloneMatrix(arena);
          testPlayer.matrix.forEach((row, y) => {
            row.forEach((value, cx) => {
              if (value !== 0) testBoard[y + testPlayer.pos.y][cx + testPlayer.pos.x] = value;
            });
          });
          const score = evaluateBoard(testBoard);
          if (score > bestScore) { bestScore = score; bestMove = { rot, x }; }
        }
      }
      return bestMove;
    }

    function playerMove(offset) {
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      
      aiTarget = null;
      aiRotationsDone = 0;
      if (autoMode) {
        aiTarget = getBestMove();
        autoSpeedMultiplier += 0.3; // Speed up each drop
      }

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let lastGamepadState = {};

    function update(time = 0) {
      // Poll gamepad
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[0];
      if (gp) {
        const buttons = {
          left: gp.buttons[14]?.pressed || gp.axes[0] < -0.5 || gp.buttons[2]?.pressed, // D-pad Left, Stick Left, X
          right: gp.buttons[15]?.pressed || gp.axes[0] > 0.5 || gp.buttons[1]?.pressed, // D-pad Right, Stick Right, B
          up: gp.buttons[12]?.pressed || gp.axes[1] < -0.5 || gp.buttons[3]?.pressed,   // D-pad Up, Stick Up, Y
          down: gp.buttons[13]?.pressed || gp.axes[1] > 0.5 || gp.buttons[0]?.pressed   // D-pad Down, Stick Down, A
        };

        if (buttons.left && !lastGamepadState.left) playerMove(-1);
        if (buttons.right && !lastGamepadState.right) playerMove(1);
        if (buttons.down && !lastGamepadState.down) playerDrop();
        if (buttons.up && !lastGamepadState.up) playerRotate(1);

        lastGamepadState = buttons;
      }

      const deltaTime = time - lastTime;
      lastTime = time;
      
      let currentDropInterval = dropInterval;
      if (autoMode) currentDropInterval = Math.max(20, dropInterval / autoSpeedMultiplier);
      
      dropCounter += deltaTime;
      if (dropCounter > currentDropInterval) {
        if (autoMode && aiTarget) {
          if (aiRotationsDone < aiTarget.rot) {
            playerRotate(1);
            aiRotationsDone++;
          } else if (player.pos.x < aiTarget.x) {
            playerMove(1);
          } else if (player.pos.x > aiTarget.x) {
            playerMove(-1);
          } else {
            playerDrop();
          }
          dropCounter = 0;
        } else {
          playerDrop();
        }
      }
      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score-val').innerText = player.score;
    }

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    const autoBtn = document.getElementById('auto-btn');
    autoBtn.addEventListener('click', () => {
      autoMode = !autoMode;
      if (autoMode) {
        autoBtn.innerText = "Auto: ON";
        autoBtn.classList.add("active");
        autoSpeedMultiplier = 2;
        aiTarget = getBestMove();
      } else {
        autoBtn.innerText = "Auto: OFF";
        autoBtn.classList.remove("active");
        autoSpeedMultiplier = 1;
      }
    });

    document.addEventListener('keydown', event => {
      // Prevent default scrolling for arrow keys
      if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
          event.preventDefault();
      }
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
