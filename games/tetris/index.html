<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --accent: #1d4ed8;
      --muted: #6b7280;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    .game-card {
      width: min(100%, 400px);
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: -0.04em;
    }
    .home-link {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .home-link:hover {
      background: var(--bg);
      border-color: var(--muted);
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 24px;
    }
    .score-label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 1.4rem;
      font-weight: 700;
    }
    canvas {
      width: 100%;
      height: auto;
      background: var(--bg);
      border-radius: 12px;
      display: block;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .hint {
      margin-top: 20px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="game-header">
      <div>
        <p class="eyebrow">Hidden Game</p>
        <h1>Tetris</h1>
      </div>
      <a href="/games/" class="home-link">Back</a>
    </div>
    
    <div class="score-row">
      <span class="score-label">Score</span>
      <span class="score-val" id="score-val">0</span>
    </div>
    
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <p class="hint">Use arrow keys to move and rotate.</p>
  </div>
  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
      if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
      if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
      if (type === 'O') return [[4, 4], [4, 4]];
      if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
      if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
      if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            const color = colors[value];
            const px = x + offset.x;
            const py = y + offset.y;
            
            context.fillStyle = color;
            context.fillRect(px, py, 1, 1);
            
            // Highlight top-left
            context.fillStyle = 'rgba(255, 255, 255, 0.6)';
            context.beginPath();
            context.moveTo(px, py);
            context.lineTo(px + 1, py);
            context.lineTo(px + 0.8, py + 0.2);
            context.lineTo(px + 0.2, py + 0.2);
            context.lineTo(px + 0.2, py + 0.8);
            context.lineTo(px, py + 1);
            context.fill();
            
            // Shadow bottom-right
            context.fillStyle = 'rgba(0, 0, 0, 0.3)';
            context.beginPath();
            context.moveTo(px + 1, py + 1);
            context.lineTo(px, py + 1);
            context.lineTo(px + 0.2, py + 0.8);
            context.lineTo(px + 0.8, py + 0.8);
            context.lineTo(px + 0.8, py + 0.2);
            context.lineTo(px + 1, py);
            context.fill();

            // Inner center (crystal core)
            context.fillStyle = 'rgba(255, 255, 255, 0.2)';
            context.fillRect(px + 0.2, py + 0.2, 0.6, 0.6);
          }
        });
      });
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid
      context.lineWidth = 0.05;
      context.strokeStyle = 'rgba(150, 150, 150, 0.2)';
      for (let i = 0; i <= canvas.width; i++) {
        context.beginPath();
        context.moveTo(i, 0);
        context.lineTo(i, canvas.height);
        context.stroke();
      }
      for (let i = 0; i <= canvas.height; i++) {
        context.beginPath();
        context.moveTo(0, i);
        context.lineTo(canvas.width, i);
        context.stroke();
      }

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(offset) {
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score-val').innerText = player.score;
    }

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    document.addEventListener('keydown', event => {
      // Prevent default scrolling for arrow keys
      if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
          event.preventDefault();
      }
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
