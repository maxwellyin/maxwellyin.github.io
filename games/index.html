<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Arcade - Maxwell J. Yin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
      z-index: 10;
    }
    h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    p.intro {
      text-align: center;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .game-list {
      list-style-type: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .game-item a {
      display: block;
      padding: 15px 20px;
      border: 1px solid #00ff00;
      color: #00ff00;
      text-decoration: none;
      font-size: 1.2rem;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      background: rgba(0, 255, 0, 0.05);
    }
    .game-item a::before {
      content: '>';
      margin-right: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .game-item a:hover {
      background-color: rgba(0, 255, 0, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
    }
    .game-item a:hover::before {
      opacity: 1;
    }
    .back-link {
      display: block;
      margin-top: 60px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: #aaa;
    }
    
    /* CRT Screen effect */
    .crt::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
  </style>
</head>
<body class="crt">
  <div class="container">
    <h1>/games/</h1>
    <p class="intro">
      ACCESS GRANTED.<br>
      Welcome to the hidden directory.<br>
      Select a module to execute:
    </p>
    <ul class="game-list">
      <li class="game-item"><a href="/games/snake/">Snake.exe</a></li>
      <li class="game-item"><a href="/games/tetris/">Tetris.exe</a></li>
      <li class="game-item"><a href="/games/minesweeper/">Minesweeper.exe</a></li>
    </ul>
    
    <a href="/" class="back-link">Return to surface</a>
  </div>
</body>
</html>
