<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games - Maxwell J. Yin</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }



    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 600px;
      width: 100%;
      padding: 60px 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: -0.02em;
    }
    p.intro {
      text-align: center;
      margin-bottom: 40px;
      line-height: 1.6;
      color: var(--text);
      opacity: 0.8;
    }
    .game-list {
      list-style-type: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .game-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 500;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .game-item a::after {
      content: '→';
      color: var(--accent);
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.2s ease;
    }
    .game-item a:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    .game-item a:hover::after {
      opacity: 1;
      transform: translateX(0);
    }
    .back-link {
      display: inline-block;
      margin-top: 60px;
      text-align: center;
      color: var(--text);
      opacity: 0.6;
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.2s;
      width: 100%;
    }
    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Games</h1>
    <p class="intro">
      A small collection of classic games.
    </p>
    <ul class="game-list">
      <li class="game-item"><a href="/games/snake/">Snake</a></li>
      <li class="game-item"><a href="/games/tetris/">Tetris</a></li>
      <li class="game-item"><a href="/games/minesweeper/">Minesweeper</a></li>
    </ul>
    
    <a href="/" class="back-link">Return to Home</a>
  </div>
</body>
</html>
