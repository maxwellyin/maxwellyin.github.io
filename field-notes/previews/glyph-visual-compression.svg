    <text x="152" y="154" fill="#e9d5ff" font-size="30" font-weight="700" letter-spacing="5">FIELD NOTES</text>
    <text x="152" y="760" fill="#f8fafc" font-size="78" font-weight="800">Visual Compression</text>
