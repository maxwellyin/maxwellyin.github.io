<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Glyph visual compression cover</title>
  <desc id="desc">Portrait cover with a document compressing into visual tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="48%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="140" cy="144" r="186" fill="#60a5fa" opacity="0.08"/>
  <circle cx="784" cy="1036" r="228" fill="#fb7185" opacity="0.08"/>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif">
    <text x="76" y="112" fill="#e9d5ff" font-size="28" font-weight="700" letter-spacing="4">FIELD NOTES</text>
    <text x="76" y="210" fill="#f8fafc" font-size="76" font-weight="800">Visual</text>
    <text x="76" y="290" fill="#f8fafc" font-size="76" font-weight="800">Compression</text>
    <text x="76" y="354" fill="#f5d0fe" font-size="28" font-weight="500">Glyph, DeepSeek-OCR, and long-context modeling through denser inputs</text>
  </g>

  <rect x="70" y="420" width="760" height="684" rx="40" fill="#ffffff" fill-opacity="0.06" stroke="#f5d0fe" stroke-opacity="0.16"/>

  <g opacity="0.98">
    <rect x="110" y="506" width="272" height="400" rx="28" fill="#fff7ed" fill-opacity="0.94"/>
    <rect x="152" y="556" width="188" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="152" y="598" width="146" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="152" y="632" width="162" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="152" y="666" width="122" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="152" y="724" width="188" height="108" rx="24" fill="url(#accent)" opacity="0.92"/>
  </g>

  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92">
    <path d="M424 700h84" stroke-width="18"/>
    <path d="M484 650l60 50-60 50" stroke-width="18"/>
  </g>

  <g>
    <rect x="576" y="548" width="180" height="180" rx="28" fill="#0f172a" fill-opacity="0.42" stroke="#f5d0fe" stroke-opacity="0.2"/>
    <g transform="translate(610 582)">
      <rect x="0" y="0" width="36" height="36" rx="10" fill="#60a5fa"/>
      <rect x="50" y="0" width="36" height="36" rx="10" fill="#a78bfa"/>
      <rect x="100" y="0" width="36" height="36" rx="10" fill="#f472b6"/>
      <rect x="0" y="50" width="36" height="36" rx="10" fill="#67e8f9"/>
      <rect x="50" y="50" width="36" height="36" rx="10" fill="#c084fc"/>
      <rect x="100" y="50" width="36" height="36" rx="10" fill="#fb7185"/>
      <rect x="0" y="100" width="36" height="36" rx="10" fill="#22d3ee"/>
      <rect x="50" y="100" width="36" height="36" rx="10" fill="#8b5cf6"/>
      <rect x="100" y="100" width="36" height="36" rx="10" fill="#f97316"/>
    </g>
  </g>
</svg>
