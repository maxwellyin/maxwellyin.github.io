<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">TRM recursive reasoning cover</title>
  <desc id="desc">Abstract cover with recursive loop geometry and compact reasoning motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="48%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="140" cy="170" r="180" fill="#38bdf8" opacity="0.1"/>
  <circle cx="1036" cy="782" r="220" fill="#22c55e" opacity="0.09"/>

  <rect x="86" y="86" width="1028" height="728" rx="38" fill="#0b1220" fill-opacity="0.16" stroke="#d1fae5" stroke-opacity="0.14"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 578c-52-37-88-97-88-165 0-112 91-203 203-203h424c112 0 203 91 203 203s-91 203-203 203H492" stroke="url(#accent)" stroke-width="22"/>
    <path d="M492 616l-86-86 86-86" stroke="#f8fafc" stroke-opacity="0.92" stroke-width="22"/>
    <path d="M706 244l86 86-86 86" stroke="#f8fafc" stroke-opacity="0.92" stroke-width="22"/>
  </g>

  <g>
    <rect x="364" y="298" width="136" height="136" rx="24" fill="#082f49" fill-opacity="0.72" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <rect x="534" y="298" width="136" height="136" rx="24" fill="#052e2b" fill-opacity="0.72" stroke="#5eead4" stroke-opacity="0.4"/>
    <rect x="704" y="298" width="136" height="136" rx="24" fill="#3f2a0b" fill-opacity="0.72" stroke="#fde68a" stroke-opacity="0.42"/>
    <rect x="450" y="468" width="304" height="96" rx="24" fill="#0f172a" fill-opacity="0.58" stroke="#d1fae5" stroke-opacity="0.16"/>
