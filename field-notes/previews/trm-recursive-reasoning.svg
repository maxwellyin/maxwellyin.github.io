    <text x="510" y="529" text-anchor="middle" fill="#7dd3fc" font-size="26" font-weight="700">Refine</text>
    <text x="602" y="529" text-anchor="middle" fill="#5eead4" font-size="26" font-weight="700">Supervise</text>
    <text x="694" y="529" text-anchor="middle" fill="#fde68a" font-size="26" font-weight="700">Repeat</text>
