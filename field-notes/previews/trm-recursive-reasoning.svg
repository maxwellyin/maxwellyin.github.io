<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">TRM recursive reasoning cover</title>
  <desc id="desc">Portrait cover with recursive loop and compact reasoning blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="48%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="130" cy="180" r="190" fill="#38bdf8" opacity="0.1"/>
  <circle cx="796" cy="1020" r="214" fill="#22c55e" opacity="0.09"/>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif">
    <text x="76" y="112" fill="#99f6e4" font-size="28" font-weight="700" letter-spacing="4">FIELD NOTES</text>
    <text x="76" y="210" fill="#f8fafc" font-size="80" font-weight="800">Recursive</text>
    <text x="76" y="290" fill="#f8fafc" font-size="80" font-weight="800">Reasoning</text>
    <text x="76" y="354" fill="#d1fae5" font-size="28" font-weight="500">Tiny Recursive Model, HRM simplification, deep supervision</text>
  </g>

  <rect x="72" y="414" width="756" height="650" rx="40" fill="#0b1220" fill-opacity="0.16" stroke="#d1fae5" stroke-opacity="0.14"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 786c-44-34-74-86-74-144 0-104 84-188 188-188h208c104 0 188 84 188 188S658 830 554 830H346" stroke="url(#loop)" stroke-width="20"/>
    <path d="M346 830l-74-74 74-74" stroke="#f8fafc" stroke-width="20" stroke-opacity="0.92"/>
    <path d="M554 456l74 74-74 74" stroke="#f8fafc" stroke-width="20" stroke-opacity="0.92"/>
  </g>

  <g>
    <rect x="238" y="532" width="128" height="128" rx="24" fill="#082f49" fill-opacity="0.72" stroke="#7dd3fc" stroke-opacity="0.34"/>
    <rect x="386" y="532" width="128" height="128" rx="24" fill="#052e2b" fill-opacity="0.72" stroke="#5eead4" stroke-opacity="0.34"/>
    <rect x="534" y="532" width="128" height="128" rx="24" fill="#3f2a0b" fill-opacity="0.72" stroke="#fde68a" stroke-opacity="0.34"/>
    <rect x="298" y="712" width="304" height="92" rx="22" fill="#0f172a" fill-opacity="0.56" stroke="#d1fae5" stroke-opacity="0.12"/>
  </g>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="24" font-weight="700">
    <text x="302" y="767" fill="#7dd3fc">Refine</text>
    <text x="422" y="767" fill="#5eead4">Supervise</text>
    <text x="562" y="767" fill="#fde68a" text-anchor="end">Repeat</text>
  </g>
