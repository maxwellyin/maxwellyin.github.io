    <rect x="78" y="696" width="232" height="206" rx="26" fill="#081f33" fill-opacity="0.6" stroke="#7dd3fc" stroke-opacity="0.22"/>
    <rect x="334" y="696" width="232" height="206" rx="26" fill="#23103a" fill-opacity="0.58" stroke="#c084fc" stroke-opacity="0.22"/>
    <rect x="590" y="696" width="232" height="206" rx="26" fill="#3f270d" fill-opacity="0.58" stroke="#f59e0b" stroke-opacity="0.22"/>
    <rect x="78" y="940" width="744" height="166" rx="30" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" stroke-opacity="0.14"/>
