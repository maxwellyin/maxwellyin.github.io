<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Long-context architecture analysis cover</title>
  <desc id="desc">Portrait cover with stacked system panels and long-context network lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#123b49"/>
      <stop offset="100%" stop-color="#1f5f6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="744" cy="160" r="188" fill="#22d3ee" opacity="0.12"/>
  <circle cx="148" cy="1034" r="210" fill="#38bdf8" opacity="0.1"/>

  <path d="M72 276c166-108 328-130 494-94 136 30 190 82 266 64" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M72 356c214 54 382 56 566 8 92-24 140-18 194-2" fill="none" stroke="#7dd3fc" stroke-opacity="0.16" stroke-width="2"/>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif">
