<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Long-context architecture analysis cover</title>
  <desc id="desc">Abstract cover with network nodes, layered architecture blocks, and long-context motif.</desc>
  <defs>
