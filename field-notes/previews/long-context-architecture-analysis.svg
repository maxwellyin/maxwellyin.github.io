    <text x="78" y="210" fill="#f8fafc" font-size="72" font-weight="800">Long-Context</text>
    <text x="78" y="288" fill="#f8fafc" font-size="72" font-weight="800">Architecture</text>
    <text x="78" y="366" fill="#f8fafc" font-size="72" font-weight="800">Analysis</text>
    <text x="78" y="432" fill="#cbd5e1" font-size="28" font-weight="500">Dense, hybrid, MoE, diffusion, and system tradeoffs</text>
  </g>

  <g opacity="0.96">
